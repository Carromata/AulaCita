spring.application.name=AulaCita
server.port=${PORT:${SERVER_PORT:8080}}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
aulacita.cookie-secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.cookie.secure=${aulacita.cookie-secure}
server.servlet.session.timeout=30m
server.error.include-message=never
server.error.include-stacktrace=never
aulacita.upload-dir=${UPLOAD_DIR:uploads}
aulacita.bootstrap-local=${AULACITA_BOOTSTRAP_LOCAL:false}
spring.servlet.multipart.max-file-size=3MB
spring.servlet.multipart.max-request-size=4MB

spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost;instanceName=SQLEXPRESS;databaseName=AulaCitaDB;encrypt=true;trustServerCertificate=true;loginTimeout=5}
spring.datasource.username=${DB_USER:aulacita_app}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.initialization-fail-timeout=0

spring.flyway.enabled=${DB_MIGRATIONS_ENABLED:false}
spring.flyway.url=${DB_MIGRATION_URL:${spring.datasource.url}}
spring.flyway.user=${DB_MIGRATION_USER:${DB_USER}}
spring.flyway.password=${DB_MIGRATION_PASSWORD:${DB_PASSWORD}}
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
spring.flyway.connect-retries=${DB_CONNECT_RETRIES:15}
spring.flyway.connect-retries-interval=2
spring.thymeleaf.cache=true
spring.jackson.time-zone=America/Lima
logging.level.org.springframework.security=WARN

spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
aulacita.mail.from=${MAIL_FROM:}
aulacita.public-url=${AULACITA_PUBLIC_URL:http://localhost:8080}
aulacita.password-reset.expiration-minutes=${PASSWORD_RESET_EXPIRATION_MINUTES:30}
