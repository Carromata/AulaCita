<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Crear contraseña | AulaCita</title>
    <link rel="stylesheet" th:href="@{/css/aulacita.css(v=20261106-glass)}">
    <script th:src="@{/js/restablecer-contrasena.js}" defer></script>
</head>
<body class="login-page">
<main class="login-card">
    <a class="brand" th:href="@{/}"><span class="brand-mark" aria-hidden="true">A</span>AulaCita</a>
    <p class="eyebrow">ENLACE DE UN SOLO USO</p>
    <h1>Elige una contraseña nueva</h1>
    <p class="muted">Debe tener al menos 12 caracteres. El enlace expira y solo se puede usar una vez.</p>
    <div id="reset-notice" class="alert" hidden role="status"></div>
    <form id="reset-form">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <label for="new-password">Nueva contraseña</label>
        <input id="new-password" type="password" autocomplete="new-password" minlength="12" maxlength="72" required>
        <label for="confirm-password">Repite la contraseña</label>
        <input id="confirm-password" type="password" autocomplete="new-password" minlength="12" maxlength="72" required>
        <button class="button full" type="submit">Guardar contraseña</button>
    </form>
    <a class="text-link" th:href="@{/login}">Volver a iniciar sesión</a>
</main>
</body>
</html>
