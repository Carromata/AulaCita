<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Recuperar contraseña | AulaCita</title>
    <link rel="stylesheet" th:href="@{/css/aulacita.css(v=20261106-glass)}">
    <script th:src="@{/js/recuperar-contrasena.js}" defer></script>
</head>
<body class="login-page">
<main class="login-card">
    <a class="brand" th:href="@{/}"><span class="brand-mark" aria-hidden="true">A</span>AulaCita</a>
    <p class="eyebrow">RECUPERACIÓN SEGURA</p>
    <h1>Recupera tu acceso</h1>
    <p class="muted">Te enviaremos un enlace de un solo uso si el correo pertenece a una cuenta activa.</p>
    <div id="recovery-notice" class="alert" hidden role="status"></div>
    <form id="recovery-form">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <div class="form-field">
            <label for="recovery-email">Correo de tu cuenta</label>
            <input id="recovery-email" type="email" autocomplete="email" maxlength="254" required>
        </div>
        <button class="button full" type="submit">Enviar enlace de recuperación</button>
    </form>
    <a class="text-link" th:href="@{/login}">Volver a iniciar sesión</a>
</main>
</body>
</html>
