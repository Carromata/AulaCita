<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ingresar | AulaCita</title><link rel="stylesheet" th:href="@{/css/aulacita.css(v=20261106-glass)}">
</head>
<body class="login-page">
<main class="login-card">
    <a class="brand" th:href="@{/}"><span class="brand-mark" aria-hidden="true">A</span>AulaCita</a>
    <p class="eyebrow">ACCESO INSTITUCIONAL</p>
    <h1>Bienvenido a AulaCita</h1>
    <p class="muted">Ingresa con el correo y la contraseña de tu cuenta.</p>
    <div class="alert alert-error" th:if="${param.error}" role="alert">No se pudo iniciar sesión. Verifica tus datos o consulta con secretaría.</div>
    <div class="alert alert-info" th:if="${param.logout}" role="status">La sesión se cerró correctamente.</div>
    <form method="post" th:action="@{/login}">
        <div class="form-field">
            <label for="username">Correo electrónico</label>
            <input id="username" name="username" type="email" autocomplete="username" required maxlength="254">
        </div>
        <div class="form-field">
            <label for="password">Contraseña</label>
            <div class="password-field">
                <input id="password" name="password" type="password" autocomplete="current-password" required>
                <button class="password-toggle" type="button" aria-controls="password" aria-pressed="false">Mostrar</button>
            </div>
        </div>
        <button class="button full login-submit" type="submit">Ingresar</button>
    </form>
    <a class="text-link" th:href="@{/recuperar-contrasena}">¿Olvidaste tu contraseña?</a>
    <a class="text-link" th:href="@{/}"><span aria-hidden="true">←</span> Volver al inicio</a>
</main>
<script th:src="@{/js/login.js}" defer></script>
</body>
</html>
