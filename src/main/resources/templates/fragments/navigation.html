<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>
<button th:fragment="sidebarToggle" id="sidebar-toggle" class="sidebar-toggle" type="button"
        aria-controls="main-sidebar" aria-expanded="true" aria-label="Ocultar menú">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    <span class="toggle-label">Ocultar menú</span>
</button>

<aside th:fragment="sidebar(activePage)" id="main-sidebar" class="sidebar" aria-label="Navegación principal">
    <a class="sidebar-brand" th:href="@{/panel}">
        <span class="brand-mark" aria-hidden="true">A</span>
        <span class="sidebar-brand-copy"><strong>AulaCita</strong><small>GESTIÓN ESCOLAR</small></span>
    </a>
    <div class="sidebar-workspace">
        <span class="sidebar-kicker">ESPACIO DE TRABAJO</span>
        <strong th:text="${currentRole}">USUARIO</strong>
        <span class="sidebar-dot" aria-hidden="true"></span>
    </div>
    <p class="sidebar-section-label">MENÚ PRINCIPAL</p>
    <nav class="sidebar-nav">
        <a class="nav-item" th:classappend="${activePage == 'panel'} ? ' active' : ''"
           th:attr="aria-current=${activePage == 'panel' ? 'page' : null}" th:href="@{/panel}">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg><span>Resumen</span><span class="nav-arrow" aria-hidden="true">›</span>
        </a>
        <a class="nav-item" th:if="${currentRole != 'DIRECTOR'}"
           th:classappend="${activePage == 'citas'} ? ' active' : ''"
           th:attr="aria-current=${activePage == 'citas' ? 'page' : null}" th:href="@{/citas}">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18m-13 4h3m-3 4h7"/></svg><span>Citas y agenda</span><span class="nav-arrow" aria-hidden="true">›</span>
        </a>
        <a class="nav-item" th:classappend="${activePage == 'notificaciones'} ? ' active' : ''"
           th:attr="aria-current=${activePage == 'notificaciones' ? 'page' : null}" th:href="@{/notificaciones}">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 8-3 8h18s-3-1-3-8M13.7 21a2 2 0 0 1-3.4 0"/></svg><span>Notificaciones</span><span class="nav-badge" id="nav-notification-badge" hidden>0</span><span class="nav-arrow" aria-hidden="true">›</span>
        </a>
        <a class="nav-item" th:if="${currentRole == 'ADMINISTRADOR' or currentRole == 'SUPERADMINISTRADOR' or currentRole == 'SECRETARIA'}"
           th:classappend="${activePage == 'gestion'} ? ' active' : ''"
           th:attr="aria-current=${activePage == 'gestion' ? 'page' : null}" th:href="@{/gestion}">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h10"/><circle cx="18" cy="17" r="3"/></svg><span>Gestión escolar</span><span class="nav-arrow" aria-hidden="true">›</span>
        </a>
        <a class="nav-item" th:if="${currentRole == 'ADMINISTRADOR' or currentRole == 'SUPERADMINISTRADOR' or currentRole == 'SECRETARIA' or currentRole == 'DIRECTOR'}"
           th:classappend="${activePage == 'reportes'} ? ' active' : ''"
           th:attr="aria-current=${activePage == 'reportes' ? 'page' : null}" th:href="@{/reportes}">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19V5m0 14h17M8 15l4-4 3 2 5-6"/></svg><span>Reportes</span><span class="nav-arrow" aria-hidden="true">›</span>
        </a>
        <a class="nav-item" th:classappend="${activePage == 'perfil'} ? ' active' : ''"
           th:attr="aria-current=${activePage == 'perfil' ? 'page' : null}" th:href="@{/perfil}">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg><span>Mi perfil</span><span class="nav-arrow" aria-hidden="true">›</span>
        </a>
        <a class="nav-item" th:href="@{/panel#ayuda}">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.6 9a2.5 2.5 0 1 1 4.4 1.6c-1.2 1.2-2 1.6-2 3.4m0 3h.01"/></svg><span>Ayuda</span><span class="nav-arrow" aria-hidden="true">›</span>
        </a>
    </nav>
    <div class="sidebar-note"><span class="note-sparkle" aria-hidden="true">✦</span><strong>Un encuentro a la vez.</strong><p>Coordina y consulta las reuniones de tu comunidad educativa.</p></div>
    <div class="sidebar-foot"><span class="sidebar-live-dot" aria-hidden="true"></span> Sesión protegida · AulaCita</div>
</aside>
</body>
</html>
