services:
  - type: web
    name: aulacita-demo
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: DB_MIGRATIONS_ENABLED
        value: "true"
      - key: DB_URL
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_MIGRATION_USER
        sync: false
      - key: DB_MIGRATION_PASSWORD
        sync: false
      - key: AULACITA_PUBLIC_URL
        sync: false
